conky.config = {

    alignment = 'top_left',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 390,
    maximum_width = 390,
    minimum_height = 560,

    use_xft = true,
    override_utf8_locale = true,
    font = 'Inter:size=9',

    default_color = 'F2F4F3',

    background = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    border_width = 0,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    double_buffer = true,

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    update_interval = 1,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    uppercase = false,
    use_spacer = 'none',

    -- all tiles and text are drawn by this script
    lua_load = '~/.config/conky/Alterf/scripts/card.lua',
    lua_draw_hook_pre = 'draw_card',
}

-- only the weather scripts live here; tiles, text and images are drawn by card.lua
conky.text = [[
${execi 100 ~/.config/conky/Alterf/scripts/weather-v2.0.sh >/dev/null 2>&1}${execi 100 ~/.config/conky/Alterf/scripts/weather-icon.sh JDWS-02 $(cat ~/.cache/weather.json | jq -r '.weather[0].icon') >/dev/null 2>&1}
]]
